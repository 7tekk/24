<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Protected Video Player</title>
<style>
  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #ffffff; }

  /* Login screen */
  #loginScreen { display: flex; justify-content: center; align-items: center; height: 100%; flex-direction: column; gap: 1em; background-color: #181818; }
  #loginScreen input { padding: 0.7em 1em; font-size: 1em; border-radius: 6px; border: 1px solid #333; background: #252525; color: white; outline: none; }
  #loginScreen button { padding: 0.7em 1.5em; font-size: 1em; border-radius: 6px; border: none; background-color: #007bff; color: white; font-weight: bold; cursor: pointer; }
  #loginScreen button:hover { background-color: #0056b3; }
  #errorMsg { color: #ff5252; display: none; margin: 0; }

  /* Main page */
  #mainPage { display: none; flex-direction: column; align-items: center; min-height: 100vh; width: 100%; }
  header { width: 100%; background-color: #1e1e1e; border-bottom: 1px solid #2e2e2e; display: flex; justify-content: center; gap: 10px; padding: 1em; position: fixed; top: 0; left: 0; z-index: 1000; }
  .nav-btn { background-color: #2b2b2b; border: 1px solid #444; color: #bbb; padding: 0.6em 1.2em; font-size: 0.95em; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  .nav-btn.active { background-color: #007bff; color: white; border-color: #007bff; }

  main { margin-top: 90px; width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; padding: 1em; }
  .tab-content { display: none; width: 100%; flex-direction: column; align-items: center; }
  .tab-content.active { display: flex; }

  .input-group { display: flex; width: 100%; gap: 0.5em; margin-bottom: 1em; }
  .input-group input { flex: 1; padding: 0.6em 1em; border-radius: 6px; border: 1px solid #333; background-color: #222; color: white; }
  .input-group button { padding: 0.6em 1.2em; background-color: #28a745; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }

  .video-list { display: flex; flex-direction: column; gap: 0.5em; width: 100%; margin-bottom: 1.5em; }
  .video-list button { background-color: #1e1e1e; border: 1px solid #333; color: #e0e0e0; border-radius: 6px; padding: 0.7em 1em; text-align: left; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 10px; }
  .video-list button:hover { background-color: #2a2a2a; border-color: #555; }
  .video-list button img { width: 40px; height: 30px; object-fit: cover; border-radius: 4px; }

  .player-container { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
  video, iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

<div id="loginScreen">
  <h2>Protected Video Portal</h2>
  <input type="password" id="passwordInput" placeholder="Enter password" onkeydown="if(event.key === 'Enter') checkPassword()">
  <button onclick="checkPassword()">Enter</button>
  <p id="errorMsg">Incorrect password</p>
</div>

<div id="mainPage">
  <header>
    <button class="nav-btn active" onclick="switchTab('directTab', this)">Direct MP4s</button>
    <button class="nav-btn" onclick="switchTab('cloudTab', this)">Cloud Vids</button>
    <button class="nav-btn" onclick="switchTab('searchTab', this)">Search Web</button>
  </header>

  <main>
    <div id="directTab" class="tab-content active">
      <div id="directList" class="video-list"></div>
      <div class="player-container">
        <video id="directPlayer" controls></video>
      </div>
    </div>

    <div id="cloudTab" class="tab-content">
      <div class="input-group">
        <input type="text" id="cloudUrlInput" placeholder="Paste Google Drive or MEGA link here...">
        <button onclick="playCustomCloudVideo()">Play</button>
      </div>
      <div id="cloudList" class="video-list"></div>
      <div class="player-container">
        <iframe id="cloudFrame" allowfullscreen allow="autoplay"></iframe>
      </div>
    </div>

    <div id="searchTab" class="tab-content">
      <div class="input-group">
        <input type="text" id="searchInput" placeholder="Search for videos on the target site..." onkeydown="if(event.key === 'Enter') performSearch()">
        <button onclick="performSearch()">Search</button>
      </div>
      <div id="searchList" class="video-list"></div>
      <div class="player-container">
        <iframe id="searchPlayer" allowfullscreen allow="autoplay"></iframe>
      </div>
    </div>
  </main>
</div>

<script>
  // 1. Password Protection
  function checkPassword() {
    const password = document.getElementById('passwordInput').value;
    if(password === 'password123') { // Set your password here
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainPage').style.display = 'flex';
      initLists();
    } else {
      document.getElementById('errorMsg').style.display = 'block';
    }
  }

  // 2. Tab Navigation
  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');

    const directPlayer = document.getElementById('directPlayer');
    directPlayer.pause();
  }

  // 3. Hardcoded Video Sources Data
  const directVideos = [
    { title: "Nature Video 1", url: "https://eu-cdn03-prem.boomio-cdn.com/remote_control.php?file=rXIPKdwAnDjLQuhIub59VRGX9LC_Pj3RL4VKVlKCOZZkynu5nKwVzuheaS2PP9F-xnDNJhZ2FK-1OzJ7RN3CUjfsVANzqnDy4QpF7tronwGP3Mtib1ngyWNoEKw-onIruh2ZlpRrtjvlVr6lwwE2bQt4wC6POnClsIqHQSwAZFiAMYFdV8MFoWXCiMJR1wib1buf2P3S6TNGZKR5Kq_4a9YvsZhQ4PLi.mp4" },
    { title: "Nature Video 2", url: "https://eu-cdn10-prem.boomio-cdn.com/remote_control.php?file=H3zUCqdFxCgAmCko7n40ABi8slo_RIF6FwhH7JrUAXWsTBZySNKSfOPKmeWLpCq_a4Pg3NVIhMaCF-olFGClZyQHXpQwfIuDYY1c3kH8V9UoiyP9QqyRbzGE1pmPJf_RI_BcF3laH2s0PWSpPs-VXvaQGXCliMviH6CZXZsDVq5wIEWZsYcaGAcfmrOoHgrE8ZWzhyhZav50uT4dxWPSgegCGx4-Qw.mp4" }
  ];

  const cloudVideos = [
    { title: "Sample Google Drive Video", url: "https://drive.google.com/file/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs/view" },
    { title: "Sample MEGA Video", url: "https://mega.nz/embed/wvAxGawK#pO4--R6tL4oT-Q2fCcKE9g" }
  ];

  function formatEmbedUrl(url) {
    if (!url) return '';
    if (url.includes('drive.google.com')) {
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) return `https://drive.google.com/file/d/${match[1]}/preview`;
    }
    if (url.includes('mega.nz') || url.includes('mega.io')) {
      if (url.includes('/embed')) return url;
      return url.replace('/file/', '/embed/').replace('/#!', '/embed/!');
    }
    return url;
  }

  function initLists() {
    const directList = document.getElementById('directList');
    directList.innerHTML = '';
    directVideos.forEach(v => {
      const btn = document.createElement('button');
      btn.textContent = "▶ " + v.title;
      btn.onclick = () => {
        const player = document.getElementById('directPlayer');
        player.src = v.url; player.load(); player.play();
      };
      directList.appendChild(btn);
    });

    const cloudList = document.getElementById('cloudList');
    cloudList.innerHTML = '';
    cloudVideos.forEach(v => {
      const btn = document.createElement('button');
      btn.textContent = "☁ " + v.title;
      btn.onclick = () => { document.getElementById('cloudFrame').src = formatEmbedUrl(v.url); };
      cloudList.appendChild(btn);
    });
  }

  function playCustomCloudVideo() {
    const input = document.getElementById('cloudUrlInput');
    if (input.value.trim()) {
      document.getElementById('cloudFrame').src = formatEmbedUrl(input.value.trim());
    }
  }

  // 4. Dynamic Web Search Logic (No Backend Required)
  async function performSearch() {
    const query = document.getElementById('searchInput').value.trim();
    const searchList = document.getElementById('searchList');
    
    if (!query) return;
    searchList.innerHTML = '<p style="color: #bbb; padding: 1em;">Scraping results...</p>';

    // IMPORTANT: Replace THE-WEBSITE.com with the actual target URL
    const targetUrl = `https://sfmcompile.club/wp-admin/admin-ajax.php?action=bimber_search&bimber_term=${encodeURIComponent(query)}`;
    
    // We wrap the target URL in a free CORS proxy so GitHub Pages doesn't get blocked
    const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`;

    try {
      // Fetch the raw HTML through the proxy
      const response = await fetch(proxyUrl);
      const htmlText = await response.text();

      // Use the browser's built-in parser instead of a backend scraper
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      
      const results = [];
      
      // Find the specific elements in the returned HTML (Bimber theme classes)
      const items = doc.querySelectorAll('article, .search-item, .bimber-ajax-search-item');
      
      items.forEach(element => {
        const titleElement = element.querySelector('.entry-title, .title');
        const linkElement = element.querySelector('a');
        const imgElement = element.querySelector('img');

        // Extract the text and links if they exist
        if (titleElement && linkElement) {
          results.push({
            title: titleElement.innerText.trim(),
            videoUrl: linkElement.href,
            thumbnail: imgElement ? imgElement.src : null
          });
        }
      });

      searchList.innerHTML = ''; 

      if (results.length === 0) {
        searchList.innerHTML = '<p style="color: #ff5252;">No videos found.</p>';
        return;
      }

      // Generate the buttons for the scraped results
      results.forEach(v => {
        const btn = document.createElement('button');
        let imgHtml = v.thumbnail ? `<img src="${v.thumbnail}" alt="thumb">` : '▶';
        btn.innerHTML = `${imgHtml} <span>${v.title}</span>`;
        
        btn.onclick = () => {
          // Loads the scraped video page into the iframe
          document.getElementById('searchPlayer').src = v.videoUrl; 
        };
        searchList.appendChild(btn);
      });

    } catch (error) {
      console.error("Search failed:", error);
      searchList.innerHTML = '<p style="color: #ff5252;">Error fetching results. The target site might be blocking the proxy.</p>';
    }
  }
</script>
</body>
</html>
